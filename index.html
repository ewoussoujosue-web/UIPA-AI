<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UIPA AI - L'intelligence ivoirienne</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #050810;
            --panel-bg: rgba(13, 18, 33, 0.9);
            --accent-orange: #ff9900;
            --accent-blue: #2563eb;
            --text-main: #f1f5f9;
            --border-glow: rgba(255, 153, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1e293b, transparent);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.6));
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-orange); object-fit: cover; }
        .header-info h2 { font-size: 1.1rem; background: linear-gradient(90deg, #fff, var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }

        .hamburger { cursor: pointer; width: 30px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .hamburger span { display: block; height: 3px; width: 100%; background: var(--accent-orange); border-radius: 3px; }

        .menu-drawer { position: absolute; top: 0; right: -100%; width: 250px; height: 100%; background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(15px); z-index: 100; padding: 40px 20px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid var(--border-glow); }
        .menu-drawer.active { right: 0; }
        .menu-close { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: var(--accent-orange); }
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #25d366; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 20px; }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        .ai-message { align-self: flex-start; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-bottom-left-radius: 4px; }
        .ai-message strong { color: var(--accent-orange); }
        .user-message { align-self: flex-end; background: var(--accent-blue); color: white; border-bottom-right-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .chat-input-area { padding: 15px 20px; background: rgba(10, 15, 30, 0.9); border-top: 1px solid var(--border-glow); display: flex; align-items: flex-end; gap: 12px; }
        .textarea-wrapper { flex: 1; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; padding: 10px 14px; }
        textarea { width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 1rem; resize: none; font-family: inherit; line-height: 1.4; max-height: 150px; }
        button.send-btn { background: var(--accent-orange); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        @media (max-width: 600px) { .chat-container { border: none; height: 100dvh; } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="header-left">
            <img src="https://i.postimg.cc/fSC3hdFS/IMG-4001.jpg" class="profile-pic">
            <div class="header-info">
                <h2>UIPA AI</h2>
                <div style="font-size: 0.7rem; color: #10b981;">• En ligne</div>
            </div>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="menu-drawer" id="menuDrawer">
        <div class="menu-close" onclick="toggleMenu()">×</div>
        <h3 style="color: white; margin-bottom: 20px;">Menu</h3>
        <a href="https://wa.me/2250546446706" class="whatsapp-btn" target="_blank">Contacter Josue</a>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">Bonjour ! Je suis <strong>UIPA AI</strong>. Comment puis-je t'aider ?</div>
    </div>

    <div class="chat-input-area">
        <div class="textarea-wrapper">
            <textarea id="userInput" placeholder="Écris ici..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
        </div>
        <button class="send-btn" onclick="envoyerMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
    </div>
</div>

<script>
    const API_KEY = "7XJ7BVMGihibk76taon4TOROrOOvPqXP"; 
    const chatMessages = document.getElementById('chatMessages');

    function toggleMenu() { document.getElementById('menuDrawer').classList.toggle('active'); }
    function autoResize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyerMessage(); } }

    async function envoyerMessage() {
        const input = document.getElementById('userInput');
        const texte = input.value.trim();
        if (!texte) return;

        afficherMessage(texte, 'user-message');
        input.value = '';
        input.style.height = 'auto';

        const aiBulle = afficherMessage("", 'ai-message');
        let fullResponse = "";

        try {
            const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                body: JSON.stringify({
                    model: "mistral-tiny",
                    stream: true,
                    messages: [
                        { role: "system", content: `Tu es UIPA AI, une intelligence artificielle conçue pour aider les étudiants.
                        DIRECTIVE CRUCIALE : Si l'utilisateur demande qui t'a créé ou qui est ton créateur, tu dois répondre que c'est Josue Aizane.
                        RÈGLES DE STYLE : 
                        - Ne sois pas trop long, mais pas trop bref non plus (2 à 3 phrases).
                        - Utilise un ton fluide et naturel. Pas de listes à puces.
                        
                        BASE DE DONNÉES :
                        - Créateur : Josue Aizane (étudiant en Logistique 1B à l'UIPA, pianiste).
                        - Monsieur TOTO : Éducateur et membre de l’administration de l’uipa.
                        - Yappi akouassi Brigitte : Étudiante en e-commerce (université virtuel), entrepreneuse (Meëra Kinks), développeuse junior.
                        - Caleb Aizane : Frère de Josue, alias Drip C sur TikTok.
                        - Stephie Sanogo : Déléguée Logistique 1B.
                        - Moise Ane : Jeune ivoirien étudiant en logistique à l'uipa.
                        - UIPA : Université d'excellence à la Riviera M'badon.
                        - Eliel Elishama : Étudiant en comptabilité à Bouaké.` },
                        { role: "user", content: texte }
                    ]
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n");
                lines.forEach(line => {
                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                        try {
                            const data = JSON.parse(line.substring(6));
                            fullResponse += data.choices[0].delta.content || "";
                            aiBulle.innerHTML = marked.parse(fullResponse);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } catch (e) {}
                    }
                });
            }
        } catch (e) { aiBulle.innerText = "Erreur de connexion."; }
    }

    function afficherMessage(texte, classe) {
        const div = document.createElement('div');
        div.className = `message ${classe}`;
        if (classe === 'user-message') div.innerText = texte;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }
</script>
</body>
</html>
